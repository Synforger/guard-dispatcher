name: CI

# Mirror of the local gate suite — the checks themselves live in the
# repository (bats suite over throwaway git repos with sentinel word
# lists) and run offline; this workflow only gives GitHub a trigger to
# run the same suite on pull requests, so external contributors get a
# status check without owning the guard machinery.
#
# Visibility guard: public-repo runner minutes are free; on a private
# repository this workflow refuses to run so it can never consume the
# plan's minute quota. Local gates remain the source of truth there.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the bats suite resolves references against history
      - name: Install bats, GNU parallel and pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q bats parallel poppler-utils
      # A developer's machine always has a name for git: the global config, or else the account's
      # full name. The runner's account has neither, and tests that move HOME lose a global one, so
      # the name is set for the whole system, where any repository's own config still wins.
      - name: A name for git, as a developer's machine has
        run: |
          sudo git config --system user.name Fixture
          sudo git config --system user.email synforger@users.noreply.github.com
      - name: Dispatcher bats suite
        run: bats -r --jobs "$(getconf _NPROCESSORS_ONLN)" tests/
